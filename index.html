<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Nightclub · Web UI Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* Tokens: Accent ladder. One small accent per palette; pale tints carry areas. Brand colour/font still [OPEN]. */
:root{
  color-scheme: light dark;
  --av-s:0%;
  /* Neutrals: pure white in light, pure black in dark, whatever the palette. */
  --nc-bg:light-dark(#ffffff,#000000); --nc-side:light-dark(#ffffff,#000000);
  --nc-surface:light-dark(#ffffff,#121212); --nc-surface-2:light-dark(#f5f5f5,#1c1c1e);
  --nc-active:light-dark(#efefef,#1f1f21); --nc-border:light-dark(#ebebeb,#262626); --nc-control:light-dark(#d4d4d4,#3d3d3f);
  --nc-text:light-dark(#0b0b0c,#f5f5f5); --nc-muted:light-dark(#6b6b6f,#a8a8ad);
  --nc-primary:light-dark(#0b0b0c,#f5f5f5); --nc-primary-t:light-dark(#ffffff,#000000);
  /* Palette (default: Pulse) */
  --nc-g1:#C81E5B; --nc-g2:#E8561A; --nc-on-grad:#ffffff; --nc-grad:linear-gradient(135deg,var(--nc-g1),var(--nc-g2));
  --nc-accent:light-dark(#C81E5B,#ff6b9c); --nc-accent-t:#ffffff; --nc-accent-bg:light-dark(#fff0f5,#2a0f1a); --nc-accent-track:light-dark(#ffd0e0,#6b1f3d); --nc-accent-ink:light-dark(#8a1240,#ffb8d0);
  --nc-success:   light-dark(#247b50, #4fc88a);
  --nc-success-bg:light-dark(#dcfce7, #12301f);
  --nc-success-ink:light-dark(#14532d, #8be0b2);
  --nc-warn:      light-dark(#92400e, #f2b45a);
  --nc-warn-bg:   light-dark(#fffbeb, #33270f);
  --nc-danger:    light-dark(#c4242a, #f0777c);
  --nc-danger-bg: light-dark(#ffedea, #3a1a1c);
  --nc-danger-ink:light-dark(#831c1e, #f5a3a6);
  --nc-shadow-lg: light-dark(0 12px 32px rgb(0 0 0 / .16), 0 12px 32px rgb(0 0 0 / .7));
  --ease:cubic-bezier(.23,1,.32,1);
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --gap:24px;
  --font: "DM Sans", system-ui, -apple-system, "Segoe UI", "Noto Sans Telugu", "Nirmala UI", sans-serif;
  accent-color: var(--nc-accent);
}
:root[data-theme="light"]{ color-scheme: light; }
:root[data-theme="dark"]{ color-scheme: dark; }
/* Palette options (prototype toggle). Each owns a gradient + an accent ladder. */
:root[data-palette="zest"]{
  --nc-g1:#0A7A1E; --nc-g2:#2E9B3F; --nc-on-grad:#ffffff; --nc-grad:linear-gradient(135deg,var(--nc-g1),var(--nc-g2));
  --nc-accent:light-dark(#0C831F,#4ed06b); --nc-accent-t:#ffffff; --nc-accent-bg:light-dark(#fff4c2,#2e2606); --nc-accent-track:light-dark(#f8cb46,#8a6f00); --nc-accent-ink:light-dark(#5c4700,#ffe07a);
}
:root[data-palette="spark"]{
  --nc-g1:#D9480F; --nc-g2:#C2255C; --nc-on-grad:#ffffff; --nc-grad:linear-gradient(135deg,var(--nc-g1),var(--nc-g2));
  --nc-accent:light-dark(#D9480F,#ff8a4c); --nc-accent-t:#ffffff; --nc-accent-bg:light-dark(#fff0e6,#2e1608); --nc-accent-track:light-dark(#ffd2b3,#6b2e0a); --nc-accent-ink:light-dark(#7a2300,#ffc9a3);
}
:root[data-palette="wave"]{
  --nc-g1:#0A66C2; --nc-g2:#0B8F8C; --nc-on-grad:#ffffff; --nc-grad:linear-gradient(135deg,var(--nc-g1),var(--nc-g2));
  --nc-accent:light-dark(#0A66C2,#5aa9ff); --nc-accent-t:#ffffff; --nc-accent-bg:light-dark(#e8f1fb,#0b1a2e); --nc-accent-track:light-dark(#c4dcf5,#1b4a80); --nc-accent-ink:light-dark(#07407d,#b3d5ff);
}
:root[data-palette="graphite"]{
  --nc-g1:light-dark(#111111,#f5f5f5); --nc-g2:light-dark(#3a3a3c,#bdbdbd); --nc-on-grad:light-dark(#ffffff,#000000); --nc-grad:linear-gradient(135deg,var(--nc-g1),var(--nc-g2));
  --nc-accent:light-dark(#111111,#ffffff); --nc-accent-t:light-dark(#ffffff,#000000); --nc-accent-bg:light-dark(#f2f2f2,#1c1c1e); --nc-accent-track:light-dark(#e0e0e0,#3a3a3c); --nc-accent-ink:light-dark(#111111,#ffffff);
}
.pal{display:flex;flex-direction:column;gap:2px}
.pal button{display:flex;align-items:center;gap:12px;padding:10px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left;width:100%}
.pal button:hover{background:var(--nc-surface-2)} .pal button[aria-pressed="true"]{background:var(--nc-active)}
.pal .sw3{display:block;flex:none;border-radius:8px;width:54px;height:28px}
.pal .sw3 i{flex:1;display:block}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--nc-bg);color:var(--nc-text);font:400 14px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
:lang(te) body, html[lang="te"] body{line-height:1.7}
h1,h2,h3,h4,p{margin:0}
h1{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--nc-accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--nc-primary);color:var(--nc-primary-t);padding:8px 14px;border-radius:6px;z-index:100;text-decoration:none}
.skip:focus{top:8px}
.muted{color:var(--nc-muted)} .small{font-size:13px} .xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px} .stack-s{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.lbl{font-size:13px;font-weight:500;color:var(--nc-muted)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* Shell: open plane. Sidebar sits on the page ground, no rule, no top bar chrome. */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:4px;padding:20px 10px 14px;background:var(--nc-side);border-right:1px solid var(--nc-border);overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:2px 10px 16px;font-weight:700;font-size:17px;letter-spacing:-.02em;text-decoration:none}
.logo b{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--nc-grad);color:var(--nc-on-grad);font-size:16px;font-weight:800}
.logo small{display:block;font-size:12px;font-weight:400;color:var(--nc-muted);letter-spacing:0;margin-top:-1px}
.sbtn{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border:1px solid var(--nc-control);border-radius:6px;background:var(--nc-surface);color:var(--nc-muted);cursor:pointer;margin-bottom:10px;font-size:14px}
.sbtn kbd{margin-left:auto;font:400 12px var(--font);color:var(--nc-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:6px;text-decoration:none;color:var(--nc-muted);position:relative}
.nav a:hover{background:var(--nc-surface-2);color:var(--nc-text)}
.nav a[aria-current="page"]{background:var(--nc-active);color:var(--nc-text);font-weight:500}
.nav a[aria-current="page"] svg.i{color:var(--nc-accent)}
.nav .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--nc-grad);color:var(--nc-on-grad);font-size:12px;font-weight:700;display:grid;place-items:center}
.nav-h{margin:28px 10px 6px;font-size:12px;font-weight:500;color:var(--nc-muted)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px;border:0;background:none;cursor:pointer;text-align:left;width:100%}
.me:hover{background:var(--nc-surface-2)}
.av{position:relative;isolation:isolate;--s:36px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;flex:none;color:hsl(var(--h) var(--av-s) 22%);font-weight:600;font-size:calc(var(--s)*.38);background:hsl(var(--h) var(--av-s) 88%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{color:hsl(var(--h) var(--av-s) 85%);background:hsl(var(--h) var(--av-s) 22%)}}
:root[data-theme="dark"] .av{color:hsl(var(--h) var(--av-s) 85%);background:hsl(var(--h) var(--av-s) 22%)}
.av.ring::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--nc-grad);z-index:-2}
.av.ring::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:var(--nc-surface);z-index:-1}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 24px;background:var(--nc-bg)}
.top .logo{display:none;padding:0}
.top .sp{flex:1}
.ib{display:grid;place-items:center;width:34px;height:34px;border-radius:6px;border:0;background:none;cursor:pointer;position:relative;color:var(--nc-text)}
.ib:hover{background:var(--nc-surface-2)}
.ib,.tbtn,.chip,.nav a,.crow,.pop-i{transition:background-color .15s,transform .16s var(--ease),color .15s}
.ib:active,.tbtn:active,button.chip:active{transform:scale(.95)}
.nav a:active{transform:scale(.98)}
.ib .dot{position:absolute;top:2px;right:0;min-width:16px;height:16px;border-radius:8px;background:var(--nc-grad);color:var(--nc-on-grad);font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.tbtn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--nc-control);background:var(--nc-surface);cursor:pointer;font-weight:500;font-size:13px}
.tbtn:hover{background:var(--nc-surface-2)}
.page{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--gap);padding:8px 32px 48px;max-width:1280px;width:100%;margin:0 auto;align-items:start}
.page.norail{grid-template-columns:minmax(0,1fr);max-width:1000px}
.col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.rail{display:flex;flex-direction:column;gap:var(--gap);position:sticky;top:60px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph p.sub{color:var(--nc-muted);margin-top:6px;max-width:64ch;font-size:15px}
.tabbar{display:none}
.seg{display:none}

/* Primitives: flat surfaces, a 1px edge, no shadow at rest. */
.card{background:var(--nc-surface);border:1px solid var(--nc-border);border-radius:var(--r-lg);padding:20px;container-type:inline-size}
.card.flat{background:var(--nc-surface)}
.card h2{margin-bottom:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border-radius:6px;border:1px solid var(--nc-control);background:var(--nc-surface);font-weight:500;font-size:14px;cursor:pointer;text-decoration:none;min-height:38px;transition:background-color .15s,filter .15s,transform .16s var(--ease)}
.btn:hover{background:var(--nc-surface-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--nc-grad);border-color:transparent;color:var(--nc-on-grad);font-weight:600}
.btn.primary:hover{background:var(--nc-grad);filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--nc-muted)}
.btn.ghost:hover{background:var(--nc-surface-2);color:var(--nc-text)}
.btn.danger{color:var(--nc-danger);border-color:var(--nc-control)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;background:var(--nc-surface-2);color:var(--nc-text);font-size:12px;font-weight:500;white-space:nowrap;flex:none}
button.chip{cursor:pointer;height:28px;padding:0 12px;border:1px solid var(--nc-control);background:var(--nc-surface)} button.chip:hover{background:var(--nc-surface-2)}
button.chip[aria-pressed="true"]{background:var(--nc-accent-bg);border-color:var(--nc-accent);color:var(--nc-accent-ink)}
.chip.ok{background:var(--nc-success-bg);color:var(--nc-success-ink)}
.chip.warn{background:var(--nc-warn-bg);color:var(--nc-warn)}
.chip.acc{background:var(--nc-accent-bg);color:var(--nc-accent-ink)}
.chip.bad{background:var(--nc-danger-bg);color:var(--nc-danger-ink)}
.prov{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px 2px 6px;border-radius:4px}
.prov svg.i{width:14px;height:14px}
.prov.verified{background:var(--nc-success-bg);color:var(--nc-success-ink)}
.prov.peer{background:var(--nc-accent-bg);color:var(--nc-accent-ink)}
.prov.self{background:var(--nc-surface-2);color:var(--nc-muted)}
.bar{height:8px;border-radius:99px;background:var(--nc-accent-bg);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--nc-grad);border-radius:99px;transition:width .5s var(--ease)}
.hr{height:1px;background:var(--nc-border);border:0;margin:0}
.link{background:none;border:0;padding:0;color:var(--nc-text);font-weight:500;cursor:pointer;text-decoration:underline;text-decoration-color:var(--nc-control);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--nc-accent)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-radius:6px;background:var(--nc-surface-2);color:var(--nc-muted);font-size:13px}
.banner svg.i{margin-top:2px}
.banner b{color:var(--nc-text);font-weight:600}
.empty{display:grid;justify-items:center;gap:8px;text-align:center;padding:32px 18px;border:1px dashed var(--nc-control);border-radius:var(--r-lg);color:var(--nc-muted)}
.empty h3{color:var(--nc-text)}
.caught{display:flex;align-items:center;gap:12px;color:var(--nc-muted);font-size:13px;padding:6px 2px}
.caught::before,.caught::after{content:"";flex:1;height:1px;background:var(--nc-border)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--nc-border);overflow:auto}
.tabs button{padding:10px 12px;border:0;background:none;cursor:pointer;font-weight:500;color:var(--nc-muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--nc-text);border-color:var(--nc-accent)}
.tabs button:hover{color:var(--nc-text)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
input[type=text],input[type=search],input[type=url],input[type=email],select,textarea{width:100%;font:inherit;color:inherit;background:var(--nc-surface);border:1px solid var(--nc-control);border-radius:6px;padding:8px 12px;min-height:38px}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:#6b6b6b;opacity:1}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--nc-accent);outline-offset:1px}
label.f{display:grid;gap:6px;font-weight:500;font-size:14px}
label.f .hint{font-weight:400;color:var(--nc-muted);font-size:12px}
.err{display:none;color:var(--nc-danger);font-size:12px;font-weight:500}
:is(input,select,textarea):user-invalid{border-color:var(--nc-danger)}
:is(input,select,textarea):user-invalid ~ .err{display:block}
input[type=range]{width:100%}
.sw{appearance:none;width:32px;height:18px;border-radius:99px;background:var(--nc-control);position:relative;cursor:pointer;flex:none;transition:background .2s;border:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.sw:checked{background:var(--nc-grad)} .sw:checked::after{transform:translateX(14px);background:var(--nc-on-grad)}
.sw:disabled{opacity:.55;cursor:not-allowed}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.kv dt{color:var(--nc-muted)}.kv dd{margin:0;font-weight:500}

/* Feature pieces */
.next{border-color:transparent;background:var(--nc-grad);color:var(--nc-on-grad);padding:24px}
.next .lead{font-size:22px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.next .muted,.next .lbl{color:color-mix(in srgb,var(--nc-on-grad) 82%,transparent)}
.next .link{color:inherit;text-decoration-color:color-mix(in srgb,var(--nc-on-grad) 55%,transparent)}
.next .btn{background:color-mix(in srgb,var(--nc-on-grad) 18%,transparent);border-color:transparent;color:var(--nc-on-grad)}
.next .btn:hover{background:color-mix(in srgb,var(--nc-on-grad) 28%,transparent)}
.next .btn.primary{background:var(--nc-on-grad);color:var(--nc-g1);filter:none}
.next .btn.ghost{background:none}
.next .av{background:color-mix(in srgb,var(--nc-on-grad) 22%,transparent);color:var(--nc-on-grad)}
.pcard{display:flex;flex-direction:column;gap:12px}
.pcard .skills{display:flex;gap:6px;flex-wrap:wrap}
.pcard .contrib{background:var(--nc-surface-2);border-radius:6px;padding:10px 12px;font-size:13px}
.pcard .contrib b{display:block;font-size:12px;font-weight:600;color:var(--nc-muted);margin-bottom:2px}
.cover{display:flex;gap:8px;flex-wrap:wrap}
.cover .chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--nc-control)}
.cover .chip.ok::before{background:var(--nc-success)} .cover .chip.warn::before{background:var(--nc-warn)}
.feedcard{display:flex;gap:12px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);align-items:stretch}
.col-b{background:var(--nc-surface-2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col-b h3{font-size:13px;font-weight:500;color:var(--nc-muted);display:flex;justify-content:space-between}
.task{background:var(--nc-surface);border:1px solid var(--nc-border);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.steps{display:flex;gap:0;list-style:none;margin:0;padding:0;overflow:auto}
.steps li{flex:1;min-width:120px;position:relative;padding-top:20px;font-size:13px}
.steps li::before{content:"";position:absolute;top:6px;left:0;right:0;height:3px;background:var(--nc-border)}
.steps li::after{content:"";position:absolute;top:0;left:0;width:15px;height:15px;border-radius:50%;background:var(--nc-surface);border:3px solid var(--nc-border)}
.steps li.done::before{background:var(--nc-success)} .steps li.done::after{background:var(--nc-success);border-color:var(--nc-success)}
.steps li.now::after{border-color:var(--nc-accent)}
.steps b{display:block;font-weight:600}
.msgs{display:grid;grid-template-columns:300px minmax(0,1fr);height:min(640px,calc(100dvh - 190px));padding:0;overflow:hidden}
.clist{border-right:1px solid var(--nc-border);overflow:auto}
.crow{display:flex;gap:10px;padding:12px 14px;border:0;background:none;width:100%;text-align:left;cursor:pointer;border-bottom:1px solid var(--nc-border)}
.crow:hover{background:var(--nc-surface-2)} .crow[aria-current="true"]{background:var(--nc-active)}
.thread{display:flex;flex-direction:column;min-width:0}
.thread header{padding:12px 16px;border-bottom:1px solid var(--nc-border);display:flex;align-items:center;gap:10px}
.tmsgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:75%;padding:8px 12px;border-radius:8px;background:var(--nc-surface-2);align-self:flex-start;font-size:14px;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--nc-grad);color:var(--nc-on-grad)}
.bub small{display:block;opacity:.75;font-size:12px;margin-top:2px}
.comp{display:flex;gap:8px;padding:12px;border-top:1px solid var(--nc-border);align-items:flex-end}
.comp textarea{min-height:38px;max-height:120px}
.starters{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.wbar{height:10px;border-radius:99px;overflow:hidden;display:flex;gap:2px;background:none}
.wbar i{display:block;height:100%;transition:width .25s}

.wrow{display:grid;grid-template-columns:140px 1fr 48px;gap:12px;align-items:center}
.wrow output{font-weight:600;text-align:right}
.stat{display:flex;flex-direction:column}.stat b{font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.02em;background:var(--nc-grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.story{display:flex;flex-direction:column;gap:10px}
.story .thumb{height:96px;border-radius:10px;background:var(--nc-grad);display:grid;place-items:center;color:var(--nc-on-grad);font-weight:600;font-size:16px;padding:8px;text-align:center}
.story.draft{border-style:dashed}

/* Overlays: the only things that float get a shadow. */
dialog{border:1px solid var(--nc-border);border-radius:12px;padding:0;background:var(--nc-surface);color:var(--nc-text);box-shadow:var(--nc-shadow-lg);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 32px)}
dialog.wide{width:min(760px,calc(100vw - 24px))}
dialog:modal{overscroll-behavior:contain}
dialog::backdrop{background:rgb(15 10 15 / .45);overflow:hidden;overscroll-behavior:contain}
.dlg-body{padding:22px;display:flex;flex-direction:column;gap:16px}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#cmd{width:min(600px,calc(100vw - 24px));margin-top:12vh}
#cmd input{border:0;border-bottom:1px solid var(--nc-border);border-radius:0;padding:16px 18px;font-size:16px;background:none}
#cmd ul{list-style:none;margin:0;padding:8px;max-height:50dvh;overflow:auto}
#cmd li button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left}
#cmd li button:hover,#cmd li button:focus-visible{background:var(--nc-active)}
[popover]{margin:0;inset:auto;position:fixed;top:56px;right:16px;border:1px solid var(--nc-border);border-radius:8px;padding:8px;background:var(--nc-surface);color:var(--nc-text);box-shadow:var(--nc-shadow-lg);width:min(360px,calc(100vw - 24px));max-height:calc(100dvh - 90px);overflow:auto}
.pop-i{display:flex;gap:10px;padding:10px;border-radius:6px;text-decoration:none;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.pop-i:hover{background:var(--nc-surface-2)}
#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none}
.toast{background:var(--nc-primary);color:var(--nc-primary-t);padding:10px 16px;border-radius:6px;box-shadow:var(--nc-shadow-lg);font-weight:500;font-size:14px;animation:tin .25s;pointer-events:auto;max-width:min(92vw,460px)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* Onboarding (no shell) */
body.onb .shell{display:none}
#onb{display:none}
body.onb #onb{display:grid;min-height:100dvh;place-items:start center;padding:48px 16px}
.onb-card{width:min(600px,100%);display:flex;flex-direction:column;gap:20px}
.pills{display:flex;gap:6px}.pills i{flex:1;height:4px;border-radius:99px;background:var(--nc-accent-track)}.pills i.on{background:var(--nc-grad)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--nc-control);border-radius:6px;cursor:pointer}
.opt:has(input:checked){border-color:var(--nc-accent);background:var(--nc-accent-bg)}

/* Responsive */
@media (max-width:1180px){ .page{grid-template-columns:minmax(0,1fr)} .rail{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))} }
@media (max-width:1023px) and (min-width:760px){

}

  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;text-decoration:none;color:var(--nc-muted);padding:6px 2px;position:relative;border-radius:6px;min-height:44px}

  .seg{display:flex;gap:4px;padding:4px;background:var(--nc-surface-2);border-radius:8px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

function renderNav(){
  const {r}=route();
  $('#nav').innerHTML=NAV.map(([k,l,i])=>{const b=badge[k]?badge[k]():0;return`<a href="#/${k}" ${r===k||(k==='circles'&&false)?'aria-current="page"':''}>${ic(i)}<span>${esc(t(l))}</span>${b?`<span class="cnt" aria-label="${b} need attention">${b}</span>`:''}</a>`}).join('');

function view(){
  const {r,rest}=route();

function setWeight(k,v){const W=S.weights,keys=Object.keys(W),others=keys.filter(x=>x!==k);v=Math.max(0,Math.min(100,+v));const rest=100-v,sum=others.reduce((a,x)=>a+W[x],0);const out={};others.forEach(x=>out[x]=sum?Math.round(W[x]/sum*rest):Math.round(rest/others.length));const diff=rest-others.reduce((a,x)=>a+out[x],0);const big=others.sort((a,b)=>out[b]-out[a])[0];out[big]=Math.max(0,out[big]+diff);out[k]=v;Object.assign(W,out);syncW()}

/* ═════════ onboarding ═════════ */
function renderOnb(){
  const o=S.onb,st=o.step,N=5;let body='';
  if(st===1)body=`<h1>What do you do best?</h1><p class="muted">A few essentials so we can introduce you to the right people. You can change everything later.</p>
   <label class="f">Your role<select name="role" required><option value="">Choose a role</option>${['Full-stack developer','Mobile developer','Designer','Marketer / growth','Founder / operator','Student / career switcher'].map(r=>`<option ${o.role===r?'selected':''}>${r}</option>`).join('')}</select><span class="err">Pick the role closest to what you do.</span></label>
   <label class="f">Main skills<span class="hint">Separate with commas</span><input type="text" name="skills" value="${esc(o.skills.join(', '))}" required><span class="err">Add at least one skill.</span></label>`;
  if(st===2)body=`<h1>Who do you want to build with?</h1><p class="muted">Tell us what you offer and what’s missing from your team.</p><label class="f">I can offer<input type="text" name="offer" value="${esc(o.offer)}" required><span class="err">Tell us something you can offer.</span></label><label class="f">I’m looking for<input type="text" name="seek" value="${esc(o.seek)}" required><span class="err">Tell us what you’re looking for.</span></label>`;
  if(st===3)body=`<h1>What are you aiming for?</h1><p class="muted">Most people want more than one thing. Set the mix; change it any time.</p>${weightsUI()}`;
  if(st===4)body=`<h1>When can you build?</h1><p class="muted">So introductions respect your time.</p><div class="grid2"><label class="f">Hours per week<select name="hrs"><option>2–4</option><option selected>5–8</option><option>9–15</option><option>15+</option></select></label><label class="f">Language<select name="lng"><option>Telugu + English</option><option>English</option><option>Telugu</option></select></label></div><label class="f">Timezone<select name="tz"><option>India Standard Time (IST)</option><option>Gulf Standard Time</option><option>US Pacific</option></select><span class="hint">We never ask for your precise location.</span></label>`;
  if(st===5)body=`<h1>Your privacy, your call</h1><p class="muted">Phone, email and social handles stay hidden. Chat happens in the app after both of you say yes.</p>
   <label class="opt"><input type="checkbox" name="consent" ${o.consent?'checked':''} required><span><b>Include me in matching</b><br><span class="small muted">Suggest me to people with complementary skills. You can switch this off anytime.</span><span class="err" style="display:block">Matching needs your consent. You can still browse without it.</span></span></label><label class="f">Portfolio link <span class="hint">(optional)</span><input type="url" name="url" placeholder="https://"></label>`;
  if(st===6){const first=Object.keys(GOALS).sort((a,b)=>S.weights[b]-S.weights[a])[0];
   body=`<p class="lbl">Your builder persona</p><h1>${esc(o.role||'Builder')} who wants to ${S.weights.startup>=S.weights.career?'build a startup':'grow a career'}</h1><p class="muted">Based only on what you told us. Remove or edit anything that’s not right.</p>
   <section class="card flat stack-s"><h3>Skills</h3><div class="row wrap">${o.skills.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div><h3 style="margin-top:8px">Suggested interests <span class="chip">Suggested</span></h3><div class="row wrap" id="sugg">${o.suggested.map((s,i)=>`<span class="chip acc">${s} <button class="link" style="color:inherit" data-a="rmsugg" data-id="${i}" aria-label="Remove ${s}">${ic('x',12)}</button></span>`).join('')||'<span class="small muted">None left.</span>'}</div><h3 style="margin-top:8px">Goal mix</h3>${wbar()}<p class="xs muted">Top goal: ${GOALS[first][0]} (${S.weights[first]}%)</p></section>
   <div class="banner">${ic('info')}<p class="small">We found <b>${S.fourCount}</b> introductions that fit. You decide who you talk to.</p></div>`}
  $('#onb').innerHTML=`<div class="onb-card"><div class="row between"><a class="logo" href="#/home" style="padding:0"><b>N</b><span>Nightclub</span></a><button class="link small" data-a="skiponb">Skip for now</button></div>${st<=N?`<div class="pills" role="img" aria-label="Step ${st} of ${N}">${Array.from({length:N},(_,i)=>`<i class="${i<st?'on':''}"></i>`).join('')}</div><p class="xs muted">Step ${st} of ${N} · saved automatically</p>`:''}
  <form class="card stack" data-form="onb" novalidate>${body}<div class="dlg-f" style="justify-content:space-between">${st>1&&st<=N?'<button type="button" class="btn ghost" data-a="onbback">Back</button>':'<span></span>'}<button class="btn primary">${st===N?'See my persona':st>N?'See my first introductions':'Continue'}</button></div></form></div>`;
}

/* ═════════ dialogs ═════════ */
function dlg(html,wide){const d=$('#dlg');d.innerHTML=`<div class="dlg-body">${html}</div>`;d.classList.toggle('wide',!!wide);if(!d.open)d.showModal()}
const dh=(t,s)=>`<div class="dlg-h"><div><h2 id="dlg-title" style="font-size:20px">${t}</h2>${s?`<p class="small muted" style="margin-top:2px">${s}</p>`:''}</div><button class="ib" data-a="close" aria-label="Close" style="margin:-6px -6px 0 0">${ic('x')}</button></div>`;
function loopDlg(){
  const L=LOOPS[LOOPKEY[route().r]||'home'];

  dlg(`${dh(L.t,L.job)}<div class="grid2">${step('T','1 · Trigger',L.T)}${step('A','2 · Action',L.A)}${step('R','3 · Variable reward',L.R)}${step('I','4 · Investment',L.I)}</div>${step('N','5 · Next trigger',L.N)}<div class="banner" style="background:var(--nc-success-bg);border-color:transparent">${ic('shield')}<div class="small"><b>Guardrail.</b> ${L.G}</div></div><p class="small muted"><b>Measured by:</b> ${L.M}</p><div class="dlg-f"><button class="btn primary" data-a="close">Got it</button></div>`,true);
}
function whyDlg(id){const m=M(id);dlg(`${dh('Why this match?',`${m.name} · ${m.role}`)}<span class="chip acc" style="align-self:flex-start">${m.tier}</span><div><h3>Reasons</h3><ul class="small" style="padding-left:18px;display:grid;gap:4px;margin-top:6px">${m.why.map(x=>`<li>${x}</li>`).join('')}</ul></div><div><h3>Limits we know about</h3><ul class="small muted" style="padding-left:18px;display:grid;gap:4px;margin-top:6px">${m.lim.map(x=>`<li>${x}</li>`).join('')}</ul></div><div><h3>Evidence</h3><div class="stack-s" style="margin-top:6px">${m.ev.map(([x,p])=>`<div class="row between wrap small"><span>${x}</span>${prov(p)}</div>`).join('')}</div></div><p class="xs muted">This is a ranking aid, not a prediction of friendship or success. We don’t show a percentage.</p><div class="dlg-f"><button class="btn" data-a="close">Close</button><button class="btn primary" data-a="req" data-id="${id}">Request introduction</button></div>`)}
function profileDlg(id){const m=M(id)||{name:'Member',role:'',h:120,skills:[],avail:'',lang:''};dlg(`${dh(m.name,m.role)}<div class="row">${av(m.name,m.h,56)}<div class="small muted">${m.avail}<br>${m.lang}</div></div><div class="row wrap">${m.skills.map(x=>`<span class="chip">${x}</span>`).join('')}</div><div class="banner">${ic('lock')}<p class="small">Phone, email and social handles aren’t shown. After you connect, you can chat in the app.</p></div><div class="dlg-f"><button class="btn danger sm" data-a="report">Report</button><button class="btn" data-a="close">Close</button><button class="btn primary" data-a="${['divya','meera','vamsi'].includes(id)?'openconv':'req'}" data-id="${id}">${['divya','meera','vamsi'].includes(id)?'Message':'Request introduction'}</button></div>`)}
function cmdOpen(){const d=$('#cmd');$('#cmdq').value='';cmdList('');d.showModal();$('#cmdq').focus()}
function cmdList(q){q=q.toLowerCase();const items=[...NAV.map(([k,l,i])=>({l:t(l),i,go:`#/${k}`,k:'Go to'})),{l:'Settings',i:'gear',go:'#/settings',k:'Go to'},{l:'Membership',i:'card',go:'#/membership',k:'Go to'},{l:'Safety & privacy',i:'shield',go:'#/safety',k:'Go to'},...MEMBERS.map(m=>({l:`${m.name} · ${m.role}`,i:'user',pro:m.id,k:'Member'})),{l:'Telugu Tutor AI',i:'circles',go:'#/circles/telugu-tutor',k:'Circle'}].filter(x=>!q||x.l.toLowerCase().includes(q)).slice(0,9);
  $('#cmdl').innerHTML=items.length?items.map(x=>`<li><button data-a="cmdgo" ${x.go?`data-go="${x.go}"`:`data-pro="${x.pro}"`}>${ic(x.i)}<span class="grow">${esc(x.l)}</span><span class="xs muted">${x.k}</span></button></li>`).join(''):'<li class="small muted" style="padding:14px">Nothing found. Try a skill, name or screen.</li>'}

/* ═════════ actions ═════════ */
function popClose(el){const p=el.closest('[popover]');if(p)try{p.hidePopover()}catch{}}
function setConvFrom(id){if(!S.convs[id])S.convs[id]=[];S.conv=id;S.convOpen=1}


/* light / dark toggle */
function effTheme(){return document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function themeBtn(){const b=document.getElementById('themebtn');if(!b)return;const d=effTheme()==='dark';b.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode');b.innerHTML=d?'<svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'}
function setTheme(id){if(id==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=id;try{id==='system'?localStorage.removeItem('nc-theme'):localStorage.setItem('nc-theme',id)}catch(e){}themeBtn()}
try{const st=localStorage.getItem('nc-theme');if(st)document.documentElement.dataset.theme=st}catch(e){}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeBtn);
themeBtn();
/* palettes (prototype toggle) */
const PALS=[['pulse','Pulse','#C81E5B','#E8561A','Hot pink to orange, social energy'],['zest','Zest','#0A7A1E','#F8CB46','Fresh green with a yellow pop'],['spark','Spark','#D9480F','#C2255C','Orange into magenta, quick-commerce'],['wave','Wave','#0A66C2','#0B8F8C','Professional blue into teal'],['graphite','Graphite','#111111','#8e8e93','Neutral black and white']];
function setPal(id){const r=document.documentElement;if(id==='pulse')delete r.dataset.palette;else r.dataset.palette=id;try{localStorage.setItem('nc-pal3',id)}catch(e){}palPop()}
function palPop(){const cur=document.documentElement.dataset.palette||'pulse';document.getElementById('pop-pal').innerHTML=`<div style="padding:8px 10px"><h2>Colour palette</h2><p class="xs muted">Try each one. Works in light and dark.</p><div class="row wrap" style="margin-top:8px">${['light','dark'].map(x=>`<button class="chip" aria-pressed="${effTheme()===x}" data-a="theme" data-id="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div><div class="pal">${PALS.map(([k,n,a,t,d])=>`<button aria-pressed="${cur===k}" data-a="pal" data-id="${k}"><span class="sw3" aria-hidden="true" style="background:linear-gradient(135deg,${a},${t})"></span><span><b>${n}</b><br><span class="xs muted">${d}</span></span></button>`).join('')}</div>`}
try{const sp=localStorage.getItem('nc-pal3');if(sp&&sp!=='pulse')document.documentElement.dataset.palette=sp}catch(e){}
palPop();
function protoPop(){$('#pop-proto').innerHTML=`<div style="padding:8px 10px"><h2>Prototype controls</h2><p class="xs muted">Not part of the product. For exploring states.</p></div><div class="stack" style="padding:6px 10px 10px"><div><p class="lbl">Theme</p><div class="row wrap" style="margin-top:6px">${['system','light','dark'].map(x=>`<button class="chip" aria-pressed="${(document.documentElement.dataset.theme||'system')===x}" data-a="theme" data-id="${x}">${x}</button>`).join('')}</div></div><div><p class="lbl">Language (sample)</p><div class="row wrap" style="margin-top:6px"><button class="chip" aria-pressed="${S.lang==='en'}" data-a="lang" data-id="en">English</button><button class="chip" aria-pressed="${S.lang==='te'}" data-a="lang" data-id="te">తెలుగు</button></div></div><div><p class="lbl">Find Your Four inventory</p><div class="row wrap" style="margin-top:6px">${[4,2,0].map(n=>`<button class="chip" aria-pressed="${S.fourCount===n}" data-a="four-n" data-id="${n}">${n===4?'Four':n===2?'Only two':'None yet'}</button>`).join('')}</div></div><button class="btn sm" data-a="reset">Reset demo</button></div>`}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='go'){popClose(b);return}
  const rv=()=>view();
  switch(a){
  case 'close':$('#dlg').close();break;
  case 'cmd':cmdOpen();break;
  case 'cmdgo':$('#cmd').close();if(b.dataset.go)location.hash=b.dataset.go;else profileDlg(b.dataset.pro);break;
  case 'loop':loopDlg();break;
  case 'hidebanner':S.banner=false;rv();break;
  case 'readall':S.notifs.forEach(n=>n.unread=0);renderNav();break;
  case 'theme-toggle':{setTheme(effTheme()==='dark'?'light':'dark');palPop();if(route().r==='settings')rv();break}
  case 'pal':{setPal(id);break}
  case 'theme':{setTheme(id);protoPop();palPop();if(route().r==='settings')rv();break}
  case 'lang':S.lang=id;document.documentElement.lang=id==='te'?'te':'en';protoPop();rv();break;
  case 'four-n':S.fourCount=+id;protoPop();rv();break;
  case 'reset':location.hash='#/home';setTimeout(()=>location.reload(),50);break;
  case 'accept-divya':S.queue.shift();S.notifs=S.notifs.filter(n=>n.id!==1);setConvFrom('divya');S.convs.divya=[{me:0,x:'Thanks for accepting! I have the dashboard data ready. Are you free this weekend?'}];toast('Connected with Divya. You can now message in the app.');rv();break;
  case 'decline-divya':S.queue.shift();toast('No problem. Divya isn’t told why.');rv();break;
  case 'skipq':S.queue.shift();rv();break;
  case 'profile':popClose(b);$('#dlg').open&&$('#dlg').close();profileDlg(id);break;
  case 'rsvp':S.rsvp[id]=!S.rsvp[id];toast(S.rsvp[id]?'You’re registered. We’ll remind you as you chose. Attendance is recorded separately.':'RSVP cancelled.');rv();if($('#dlg').open&&$('#dlg').dataset.s)$('#dlg').close();break;
  case 'why':whyDlg(id);break;
  case 'req':{S.four[id]='requested';$('#dlg').open&&$('#dlg').close();toast(`Request sent to ${M(id).name.split(' ')[0]}. We’ll tell you when they reply.`);rv();break}
  case 'save4':S.four[id]=S.four[id]==='saved'?'none':'saved';rv();break;
  case 'notnow':dlg(`${dh('Not now?','Optional: this helps us suggest better people.')}<div class="stack-s">${['Not the skill I need','Wrong goal','Timing isn’t right','Prefer not to say'].map(x=>`<label class="opt"><input type="radio" name="r" ${x==='Prefer not to say'?'checked':''}> ${x}</label>`).join('')}</div><div class="dlg-f"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="notnow-ok" data-id="${id}">Dismiss</button></div>`);break;
  case 'notnow-ok':S.four[id]='declined';$('#dlg').close();rv();break;
  case 'undo4':S.four[id]='none';rv();break;
  case 'sim':S.four[id]=b.dataset.v;if(b.dataset.v==='accepted'){setConvFrom(id);S.convs[id]=[{me:0,x:`Hi Ravi, glad to connect. ${M(id).contrib}`}];toast(`${M(id).name.split(' ')[0]} accepted. You can message in the app.`)}else toast('Declined. A replacement is available.');rv();break;
  case 'replace':{const r=id==='anjali'?'harsha':id==='priya'?'vamsi':'meera';profileDlg(r);break}
  case 'propose':case 'propose2':dlg(`${dh('Propose a circle','Invite the people who said yes. Nobody joins without accepting.')}<div class="stack-s">${MEMBERS.slice(0,4).filter(m=>['requested','accepted'].includes(S.four[m.id])).map(m=>`<label class="opt"><input type="checkbox" checked> ${av(m.name,m.h,28)} ${m.name} <span class="chip ${S.four[m.id]==='accepted'?'ok':'warn'}">${stLabel(S.four[m.id])}</span></label>`).join('')||'<p class="small muted">Start with just yourself and invite people later.</p>'}</div><label class="f">What are you building?<input type="text" id="cobj" value="Telugu Tutor AI" required><span class="err">Give the circle a goal.</span></label><p class="xs muted">Circles are 2–5 people by default. You can start smaller.</p><div class="dlg-f"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="propose-ok">Send invitations</button></div>`);break;
  case 'propose-ok':$('#dlg').close();toast('Invitations sent. The circle forms when people accept.');break;
  case 'feedback':dlg(`${dh('Give feedback',`On ${M(id).name.split(' ')[0]}’s update`)}<label class="f">Your feedback<span class="hint">Specific and kind works best. Tell them what worked and one thing to try.</span><textarea id="fb" required minlength="12"></textarea><span class="err">Add a little more detail so it’s useful.</span></label><div class="dlg-f"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="feedback-ok">Send feedback</button></div>`);break;
  case 'feedback-ok':{const t=$('#fb');if(!t.checkValidity()){t.reportValidity();break}$('#dlg').close();toast('Feedback sent. Thank you.');break}
  case 'save':S.saved[id]=!S.saved[id];toast(S.saved[id]?'Saved':'Removed from saved');rv();break;
  case 'contribute':dlg(`${dh('Ask to contribute',`Message to ${M(id).name.split(' ')[0]}`)}<label class="f">What could you help with?<textarea>I can help with the web UI. I have about 6 hours a week.</textarea></label><div class="dlg-f"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="toastok" data-id="Sent. They’ll reply in the app.">Send</button></div>`);break;
  case 'toastok':$('#dlg').open&&$('#dlg').close();toast(id);break;
  case 'dtab':S.dtab=id;rv();break;
  case 'cat':S.cat=id;$$('#cats .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.id===id));results();break;
  case 'savesearch':toast('Search saved. We’ll digest new matches, only if they genuinely qualify.');break;
  case 'ofilter':S.ofilter=id;if($('#obody'))$('#obody').innerHTML=oppsBody();else dbody();break;
  case 'opp':{const o=OPPS.find(x=>x.id===id);dlg(`${dh(o.title,o.org)}<div class="row wrap">${o.verified?'<span class="chip ok">Verified listing</span>':'<span class="chip warn">Community experiment</span>'}<span class="chip">${GOALS[o.goal][0]}</span></div><p><b>Why it fits:</b> ${o.why}</p><div class="banner">${ic('info')}<p class="small">Introductions are not hiring guarantees. The company sees your contact details only if you choose to share them.</p></div><div class="dlg-f"><button class="btn" data-a="close">Close</button><button class="btn" data-a="toastok" data-id="Introduction requested.">Request introduction</button><button class="btn primary" data-a="toastok" data-id="Interest sent with your Passport evidence.">Express interest</button></div>`);break}
  case 'inv':S.inv='done';toast(id==='join'?'You joined Hackathon Dashboard Team.':'Invitation declined.');rv();break;
  case 'ctab':S.circleTab=id;rv();break;
  case 'leave':dlg(`${dh('Leave this circle?','You can leave any time. Teammates are told you left, nothing else.')}<div class="dlg-f"><button class="btn" data-a="close" autofocus>Stay</button><button class="btn danger" data-a="leave-ok">Leave circle</button></div>`);break;
  case 'leave-ok':$('#dlg').close();toast('You left the circle (prototype: nothing changed).');break;
  case 'claim':{const x=S.tasks.find(t=>t.id===id);x.who='me';x.st='doing';toast('Claimed. It’s on your board.');rv();break}
  case 'evidence':dlg(`${dh('Submit evidence','Attach something a teammate can check.')}<label class="f">Link to artifact<input type="url" id="ev" placeholder="https://github.com/…" required><span class="err">Enter a valid link so reviewers can check it.</span></label><label class="f">Short note<textarea placeholder="What did you build, and what should the reviewer look at?"></textarea></label><div class="dlg-f"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="evidence-ok" data-id="${id}">Request review</button></div>`);break;
  case 'evidence-ok':{const i=$('#ev');if(!i.checkValidity()){i.reportValidity();break}S.tasks.find(t=>t.id===id).st='review';$('#dlg').close();toast('Review requested.');rv();break}
  case 'simreview':{const x=S.tasks.find(t=>t.id===id);x.st='verified';toast(id==='t3'?'Verified by your team. Milestone complete! A Passport draft is ready.':'Verified.');rv();break}
  case 'review':{const x=S.tasks.find(t=>t.id==='t2');dlg(`${dh('Review: Lesson API endpoints','Requested by Vamsi Krishna')}<div class="card flat stack-s"><div class="row between"><b class="small">Evidence</b>${prov('verified')}</div><p class="small muted">Pull request · 14 files · tests passing</p></div><fieldset style="border:1px solid var(--nc-border);border-radius:12px;padding:12px" class="stack-s"><legend class="small"><b>Checklist</b></legend>${['Endpoints match the agreed contract','Auth edge cases are covered','Errors are readable'].map(c=>`<label class="row small"><input type="checkbox"> ${c}</label>`).join('')}</fieldset><div class="dlg-f"><button class="btn" data-a="review-no">Request changes</button><button class="btn primary" data-a="review-ok">Accept &amp; verify</button></div>`);break}
  case 'review-ok':{S.tasks.find(t=>t.id==='t2').st='verified';if(S.queue[0]==='review')S.queue.shift();S.notifs=S.notifs.filter(n=>n.id!==2);$('#dlg').close();toast('Verified. Vamsi is notified.');rv();break}
  case 'review-no':$('#dlg').close();toast('Changes requested, with your checklist attached.');break;
  case 'rescope':dlg(`${dh('Adjust the plan','No blame. Plans change.')}<label class="f">What changed?<select><option>Took longer than expected</option><option>Priorities shifted</option><option>Need help with a part of it</option></select></label><label class="f">New proposed date<input type="text" value="Next Wednesday"></label><p class="xs muted">The team will be asked to agree to the new date.</p><div class="dlg-f"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="toastok" data-id="Proposed to the team.">Propose new date</button></div>`);break;
  case 'sess':{const s=SESS.find(x=>x.id===id);dlg(`${dh(s.title,s.when)}<p>${s.what}</p><div><h3>Prepare</h3><ul class="small" style="padding-left:18px;margin-top:6px;display:grid;gap:4px">${s.prereq.map(p=>`<li>${p}</li>`).join('')}</ul></div><div class="banner">${ic('lock')}<p class="small">The join link appears here 15 minutes before it starts, for registered, entitled members only.</p></div><div class="dlg-f"><button class="btn" data-a="close">Close</button><button class="btn" data-a="toastok" data-id="Calendar file downloaded.">Add to calendar</button><button class="btn primary" data-a="rsvp" data-id="${s.id}">${S.rsvp[s.id]?'Cancel RSVP':'RSVP'}</button></div>`);break}
  case 'notes':toast('Opens your saved notes and next build step.');break;
  case 'conv':S.conv=id;S.convOpen=1;rv();break;
  case 'mback':S.convOpen=0;rv();break;
  case 'openconv':{$('#dlg').open&&$('#dlg').close();setConvFrom(id);location.hash='#/messages';if(route().r==='messages')rv();break}
  case 'starter':{const ta=$('form[data-form=chat] textarea');ta.value=id;ta.focus();break}
  case 'mute':popClose(b);toast('Conversation muted. You’ll still see it in your inbox.');break;
  case 'block':popClose(b);dlg(`${dh('Block this member?','They won’t be able to message you or find you. They aren’t told.')}<div class="dlg-f"><button class="btn" data-a="close">Cancel</button><button class="btn danger" data-a="toastok" data-id="Blocked. You can undo this in Safety.">Block</button></div>`);break;
  case 'report':popClose(b);dlg(`${dh('Report','We’ll only send factual status updates about your report.')}<label class="f">What happened?<select required><option value="">Choose</option><option>Unwanted or harassing message</option><option>Suspicious invitation</option><option>Fake or misleading profile</option><option>Privacy concern</option></select><span class="err">Choose what happened.</span></label><label class="f">Details <span class="hint">(optional)</span><textarea></textarea></label><div class="dlg-f"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="toastok" data-id="Report received. We’ll update you here.">Submit report</button></div>`);break;
  case 'unblock':S.blocked.splice(+id,1);rv();break;
  case 'publish':{const dr=id==='draft';dlg(`${dh('Publish a project story','Choose how it’s shown. Teammates can validate it.')}<label class="f">Title<input type="text" id="pt" value="${dr?'Voice lesson prototype':''}" required><span class="err">Give your story a title.</span></label><label class="f">Your role<input type="text" id="pr" value="${dr?'UI & integration':''}" required><span class="err">Say what you did.</span></label><label class="f">What happened?<textarea placeholder="What did you build, and what changed because of it?"></textarea></label><fieldset style="border:0;padding:0" class="stack-s"><legend class="small"><b>Visibility</b></legend>${['Private','Members only','Public link'].map((v,i)=>`<label class="opt"><input type="radio" name="vis" ${i===1?'checked':''}> ${v}</label>`).join('')}</fieldset><p class="xs muted">Don’t share confidential client work. New stories start as ${prov('self')}${dr?' (the milestone itself is verified)':''} until teammates validate.</p><div class="dlg-f"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="publish-ok" data-id="${dr?'draft':''}">Publish</button></div>`);break}
  case 'publish-ok':{const t=$('#pt'),r=$('#pr');if(!t.checkValidity()){t.reportValidity();break}if(!r.checkValidity()){r.reportValidity();break}S.stories.unshift({id:id||'n'+Date.now(),t:t.value,role:r.value,h:Math.floor(Math.random()*300),p:id==='draft'?'verified':'self',d:'Just published. Teammates can now validate it.'});$('#dlg').close();toast('Published. Validation requested from your teammates.');rv();break}
  case 'stab':S.settingsTab=id;rv();break;
  case 'preset':{Object.assign(S.weights,JSON.parse(b.dataset.w));syncW();toast('Goals updated. Recommendations will adapt.');break}
  case 'export':toast('Export requested. We’ll email a download link.');break;
  case 'delacct':dlg(`${dh('Delete your account?','This removes your profile, messages and Passport. It can’t be undone.')}<div class="dlg-f"><button class="btn" data-a="close" autofocus>Keep my account</button><button class="btn danger" data-a="toastok" data-id="Prototype: nothing was deleted.">Delete everything</button></div>`);break;
  case 'pay':toast('Opens secure payment update.');break;
  case 'cancel':dlg(`${dh('Cancel membership?','You’ll keep access until 3 Dec 2026.')}<p class="small muted">That’s it, one confirmation, the same effort as signing up. Your data stays yours; you can export it any time.</p><div class="dlg-f"><button class="btn" data-a="close" autofocus>Keep membership</button><button class="btn danger" data-a="toastok" data-id="Prototype: membership unchanged.">Cancel membership</button></div>`);break;
  case 'rmsugg':S.onb.suggested.splice(+id,1);renderOnb();break;
  case 'onbback':S.onb.step--;renderOnb();break;
  case 'skiponb':location.hash='#/home';break;
  }
});
document.addEventListener('input',e=>{
  const w=e.target.closest('[data-w]');if(w){setWeight(w.dataset.w,w.value);return}
  if(e.target.id==='q'){S.q=e.target.value;results()}
  if(e.target.id==='cmdq')cmdList(e.target.value);
});
document.addEventListener('change',e=>{
  const p=e.target.closest('[data-pref]');if(p){S.prefs[p.dataset.pref]=p.checked;toast(p.checked?'Turned on':'Turned off')}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const k=f.dataset.form;
  if(k==='chat'||k==='circlechat'){const v=f.m.value.trim();if(!v)return;const key=k==='circlechat'?'circle':S.conv;(S.convs[key]=S.convs[key]||[]).push({me:1,x:v});
    if(k==='chat'&&key!=='circle')setTimeout(()=>{if(route().r!=='messages'||S.conv!==key)return;S.convs[key].push({me:0,x:'Sounds good! Let me check my week and get back to you shortly.'});view()},1100);
    view();const ta=$('form[data-form] textarea, form[data-form] input[name=m]');ta&&ta.focus()}
  if(k==='onb'){const o=S.onb;if(!f.checkValidity()){f.reportValidity();return}
    if(o.step===1){o.role=f.role.value;o.skills=f.skills.value.split(',').map(s=>s.trim()).filter(Boolean)}
    if(o.step===2){o.offer=f.offer.value;o.seek=f.seek.value}
    if(o.step===5)o.consent=f.consent.checked;
    if(o.step===6){location.hash='#/four';o.step=1;return}
    o.step++;renderOnb();scrollTo(0,0)}
});
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#cmd').open?$('#cmd').close():cmdOpen()}});
$('#cmdq').addEventListener('keydown',e=>{if(e.key==='Enter'){const f=$('#cmdl button');if(f)f.click()}});
$('#pop-proto').addEventListener('beforetoggle',e=>{if(e.newState==='open')protoPop()});
/* Safari fallback for closedby="any": close on outside press+release */
if(!('closedBy' in HTMLDialogElement.prototype)){for(const d of $$('dialog[closedby="any"]')){let down=false;const out=(e)=>{const r=d.getBoundingClientRect();return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom};d.addEventListener('pointerdown',e=>{down=out(e)});d.addEventListener('pointerup',e=>{if(down&&out(e))d.close()})}}
addEventListener('resize',()=>{$('#topsearch').style.display=matchMedia('(max-width:759px)').matches?'grid':'none'});
view();
</script>
</body>
</html>
